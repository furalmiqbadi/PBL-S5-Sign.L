name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze dan test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Ambil dependency
        run: flutter pub get

      - name: Analisis kode
        run: flutter analyze

      - name: Jalankan test
        run: flutter test
