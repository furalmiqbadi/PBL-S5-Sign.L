org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kompilasi Kotlin di dalam proses Gradle (tanpa Kotlin daemon terpisah),
# supaya build tidak butuh menulis ke folder daemon di luar proyek.
kotlin.compiler.execution.strategy=in-process
# Beberapa plugin Flutter (mis. shared_preferences_android) punya JVM target
# Java 1.8 vs Kotlin yang tidak sama; jadikan peringatan agar build tidak gagal.
kotlin.jvm.target.validation.mode=warning
# Nonaktifkan incremental compilation Kotlin (menghindari error
# "Could not close incremental caches" di Windows).
kotlin.incremental=false
